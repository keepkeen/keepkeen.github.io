<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codebase Map</title>
<style>
/* ============ theme (validated palette — see dataviz references) ============ */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --surface-2: #f2f1ed;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --hairline: #e1e0d9;
  --baseline: #c3c2b7;
  --ring: rgba(11,11,11,0.10);
  --grid-dot: #dddcd4;
  --slot-1: #2a78d6; --slot-2: #1baf7a; --slot-3: #eda100; --slot-4: #008300;
  --slot-5: #4a3aa7; --slot-6: #e34948; --slot-7: #e87ba4; --slot-8: #eb6834;
  --c-other: #a5a39b;
  --hatch: rgba(11,11,11,0.20);
  --font-mono: ui-monospace, "SF Mono", Menlo, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --surface-2: #232322;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --hairline: #2c2c2a;
    --baseline: #383835;
    --ring: rgba(255,255,255,0.10);
    --grid-dot: #262624;
    --slot-1: #3987e5; --slot-2: #199e70; --slot-3: #c98500; --slot-4: #008300;
    --slot-5: #9085e9; --slot-6: #e66767; --slot-7: #d55181; --slot-8: #d95926;
    --c-other: #6b6a64;
    --hatch: rgba(255,255,255,0.22);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --surface-2: #232322;
  --ink-1: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --hairline: #2c2c2a;
  --baseline: #383835;
  --ring: rgba(255,255,255,0.10);
  --grid-dot: #262624;
  --slot-1: #3987e5; --slot-2: #199e70; --slot-3: #c98500; --slot-4: #008300;
  --slot-5: #9085e9; --slot-6: #e66767; --slot-7: #d55181; --slot-8: #d95926;
  --c-other: #6b6a64;
  --hatch: rgba(255,255,255,0.22);
}

/* ============ base ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--page);
  color: var(--ink-1);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 28px; }
.kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

/* ============ header ============ */
header.site { border-bottom: 1px solid var(--hairline); background: var(--surface-1); position: relative; }
header.site::after {
  content: "";
  position: absolute; inset: 0;
  background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
  background-size: 22px 22px;
  opacity: .5;
  pointer-events: none;
}
.masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 30px 0 22px; position: relative; z-index: 1; flex-wrap: wrap; }
.masthead h1 { font-family: var(--font-mono); font-size: clamp(24px, 3.4vw, 38px); font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; margin-top: 8px; }
.masthead h1 .dim { color: var(--ink-3); font-weight: 450; }
.meta-right { text-align: right; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.meta-right .snapshot { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.theme-btn { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--hairline); border-radius: 999px; padding: 4px 12px; color: var(--ink-2); background: var(--surface-1); }
.theme-btn:hover { border-color: var(--baseline); color: var(--ink-1); }

.stats { display: grid; grid-template-columns: repeat(6, 1fr); position: relative; z-index: 1; border-top: 1px solid var(--hairline); }
.stat { padding: 14px 18px 16px 18px; border-left: 1px solid var(--hairline); }
.stat:first-child { border-left: none; padding-left: 0; }
.stat .v { font-family: var(--font-mono); font-size: 26px; font-weight: 620; letter-spacing: -0.02em; line-height: 1.15; }
.stat .l { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
.stat .s { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-top: 1px; }
@media (max-width: 980px) { .stats { grid-template-columns: repeat(3, 1fr); } .stat:nth-child(4) { border-left: none; padding-left: 0; } }

nav.tabs { display: flex; gap: 2px; position: relative; z-index: 1; overflow-x: auto; }
nav.tabs button { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); padding: 12px 16px 10px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink-1); }
nav.tabs button[aria-selected="true"] { color: var(--ink-1); border-bottom-color: var(--ink-1); }

/* ============ views ============ */
main { padding: 26px 0 60px; }
section.view { display: none; }
section.view.active { display: block; animation: viewin .25s ease; }
@keyframes viewin { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.view-head h2 { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.view-head .sub { font-size: 12.5px; color: var(--ink-2); }

/* ============ architecture ============ */
.arch-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .arch-layout { grid-template-columns: 1fr; } }
.graph-card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 10px; overflow-x: auto; }
#graph { position: relative; min-width: 860px; background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: 22px 22px; }
#graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#graph svg path { fill: none; stroke: var(--baseline); stroke-width: 1; opacity: .28; transition: opacity .15s, stroke .15s; }
#graph.focused svg path { opacity: .05; }
#graph.focused svg path.is-imports { stroke: var(--slot-1); stroke-width: 1.6; opacity: .95; }
#graph.focused svg path.is-imported { stroke: var(--slot-8); stroke-width: 1.6; opacity: .95; }
.gnode { position: absolute; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 7px; box-shadow: 0 1px 2px var(--ring); padding: 6px 10px 6px 13px; cursor: pointer; transition: opacity .15s, border-color .15s, transform .1s; user-select: none; }
.gnode::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 7px 0 0 7px; background: var(--kc, var(--c-other)); }
.gnode.testpkg { border-style: dashed; }
.gnode.testpkg::before { background: var(--c-other); }
.gnode:hover { border-color: var(--baseline); transform: translateY(-1px); }
.gnode.selected { border-color: var(--ink-1); box-shadow: 0 0 0 1px var(--ink-1), 0 2px 8px var(--ring); }
#graph.focused .gnode.dimmed { opacity: .3; }
.gnode .gname { display: block; font-family: var(--font-mono); font-size: 12.5px; font-weight: 620; line-height: 1.3; }
.gnode .gmeta { display: block; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-3); line-height: 1.4; }
.row-label { position: absolute; left: 10px; font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); opacity: .8; user-select: none; }
.graph-legend { display: flex; gap: 18px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--hairline); font-size: 11px; color: var(--ink-2); position: sticky; left: 0; }
.graph-legend .li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 8px; border-radius: 2px; display: inline-block; }
.sw.line { height: 2px; border-radius: 1px; }
.sw.dashed { border: 1px dashed var(--ink-3); background: transparent; height: 10px; }
.tooling-strip { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tooling-strip .chip { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 999px; padding: 2px 10px; background: var(--surface-1); cursor: default; }
.tooling-strip .chip:hover { border-color: var(--baseline); color: var(--ink-1); }

.panel { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 10px; padding: 18px 18px 20px; position: sticky; top: 16px; max-height: calc(100vh - 40px); overflow-y: auto; }
.panel h3 { font-family: var(--font-mono); font-size: 17px; font-weight: 650; margin: 3px 0 2px; overflow-wrap: anywhere; }
.panel .badges { display: flex; gap: 6px; margin: 6px 0 10px; flex-wrap: wrap; }
.badge { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--hairline); color: var(--ink-2); }
.badge.kind { border-color: var(--kc); color: var(--kc); }
.panel p.purpose { font-size: 13px; color: var(--ink-1); }
.panel .runtime { font-size: 12px; color: var(--ink-2); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hairline); }
.panel .pstats { display: flex; margin: 12px 0; border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; }
.panel .pstats div { flex: 1; padding: 8px 10px; border-left: 1px solid var(--hairline); }
.panel .pstats div:first-child { border-left: none; }
.panel .pstats .v { font-family: var(--font-mono); font-size: 15px; font-weight: 620; }
.panel .pstats .l { font-size: 9.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.panel h4 { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; }
.panel ul.areas { list-style: none; }
.panel ul.areas li { font-size: 12px; color: var(--ink-2); padding: 5px 0 5px 14px; border-left: 2px solid var(--hairline); margin-bottom: 4px; }
.panel ul.areas li b { font-family: var(--font-mono); font-weight: 620; color: var(--ink-1); font-size: 11.5px; }
.dep-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.dep-chips button { font-family: var(--font-mono); font-size: 11px; padding: 2px 9px; border: 1px solid var(--hairline); border-radius: 999px; color: var(--ink-2); background: var(--surface-1); }
.dep-chips button:hover { border-color: var(--slot-1); color: var(--slot-1); }
.dep-chips.rev button:hover { border-color: var(--slot-8); color: var(--slot-8); }
.explore-btn { margin-top: 16px; width: 100%; font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 9px 12px; border-radius: 8px; background: var(--ink-1); color: var(--page); transition: transform .1s; }
.explore-btn:hover { transform: translateY(-1px); }
.flow-steps { list-style: none; counter-reset: fs; }
.flow-steps li { counter-increment: fs; position: relative; padding: 6px 0 6px 34px; font-size: 12.5px; color: var(--ink-2); }
.flow-steps li b { color: var(--ink-1); font-family: var(--font-mono); font-size: 12px; }
.flow-steps li::before { content: counter(fs, decimal-leading-zero); position: absolute; left: 0; top: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); border: 1px solid var(--hairline); border-radius: 4px; padding: 0 4px; }
details.story { margin-top: 14px; }
details.story summary { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); cursor: pointer; text-transform: uppercase; letter-spacing: .1em; }
details.story p { font-size: 12px; color: var(--ink-2); margin-top: 8px; }

/* ============ files / treemap ============ */
.files-toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.files-toolbar select { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-1); color: var(--ink-1); border: 1px solid var(--hairline); border-radius: 7px; padding: 6px 10px; max-width: 320px; }
.crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 12px; }
.crumbs button { color: var(--slot-1); padding: 2px 4px; border-radius: 4px; }
.crumbs button:hover { background: var(--surface-2); }
.crumbs .sep { color: var(--ink-3); }
.crumbs .here { color: var(--ink-1); font-weight: 620; padding: 2px 4px; }
.type-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; font-size: 11px; color: var(--ink-2); }
.type-legend .li { display: inline-flex; align-items: center; gap: 5px; cursor: default; }
.type-legend .li:hover { color: var(--ink-1); }
.files-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 1100px) { .files-layout { grid-template-columns: 1fr; } }
#treemap { position: relative; height: clamp(480px, calc(100vh - 320px), 860px); background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
.tm-cell { position: absolute; border-radius: 3px; overflow: hidden; }
.tm-file.hatched { background-image: repeating-linear-gradient(45deg, var(--hatch) 0 2px, transparent 2px 7px); }
.tm-file .lbl, .tm-dircell .lbl {
  position: absolute; top: 2px; left: 3px; right: 3px;
  font-family: var(--font-mono); font-size: 10px; line-height: 1.35;
  color: var(--ink-1);
  background: color-mix(in srgb, var(--surface-1) 82%, transparent);
  border-radius: 3px; padding: 0 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  width: fit-content; max-width: calc(100% - 6px);
  pointer-events: none;
}
.tm-dircell { background: var(--surface-2); border: 1px solid var(--baseline); cursor: pointer; }
.tm-dircell:hover { border-color: var(--ink-2); }
.tm-group { position: absolute; border: 1px solid var(--baseline); border-radius: 4px; background: var(--surface-1); }
.tm-group > .hd { position: absolute; top: 0; left: 0; right: 0; height: 17px; font-family: var(--font-mono); font-size: 10px; font-weight: 620; line-height: 17px; padding: 0 5px; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.tm-group > .hd:hover { color: var(--ink-1); background: color-mix(in srgb, var(--surface-2) 60%, var(--surface-1)); }
.tm-group > .body { position: absolute; top: 17px; left: 0; right: 0; bottom: 0; }
#treemap.type-focus .tm-file:not(.type-hit) { opacity: .18; }
.tm-hint { position: absolute; inset: auto 8px 6px auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-3); pointer-events: none; }
.side-card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 10px; padding: 16px 16px 18px; }
.side-card + .side-card { margin-top: 14px; }
.side-card h4 { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.side-card .bigpath { font-family: var(--font-mono); font-size: 12.5px; font-weight: 620; overflow-wrap: anywhere; margin-bottom: 8px; }
.kv { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); padding: 3px 0; }
.kv b { font-family: var(--font-mono); color: var(--ink-1); font-weight: 620; }
.typebar { display: flex; height: 12px; gap: 2px; border-radius: 3px; overflow: hidden; margin: 8px 0; }
.typebar div { border-radius: 2px; min-width: 2px; }
.typerow { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-2); padding: 2px 0; }
.typerow .sw { width: 10px; height: 10px; border-radius: 2px; }
.typerow b { font-family: var(--font-mono); color: var(--ink-1); margin-left: auto; font-weight: 600; }
.topfiles { list-style: none; }
.topfiles li { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-top: 1px dashed var(--hairline); cursor: pointer; }
.topfiles li:first-child { border-top: none; }
.topfiles li:hover .fp { color: var(--slot-1); }
.topfiles .fp { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); overflow-wrap: anywhere; }
.topfiles .fl { font-family: var(--font-mono); font-size: 11px; color: var(--ink-1); font-weight: 620; margin-left: auto; white-space: nowrap; }

/* ============ facets ============ */
.facet-grid { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
.facet-grid.cols-2 { grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); }
@media (max-width: 1000px) { .facet-grid.cols-2 { grid-template-columns: 1fr; } }
.facet-card { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 10px; padding: 16px 18px 18px; }
.facet-card > h3 { font-family: var(--font-mono); font-size: 13px; font-weight: 650; margin-bottom: 2px; }
.facet-card > .sub { font-size: 12px; color: var(--ink-2); margin-bottom: 12px; }
.tiles-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 900px; }
@media (max-width: 800px) { .tiles-row { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; }
.tile .v { font-family: var(--font-mono); font-size: 28px; font-weight: 640; letter-spacing: -0.02em; }
.tile .l { font-size: 11.5px; color: var(--ink-2); }
.tile .s { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); margin: 0 0 12px; }
.chart-legend .li { display: inline-flex; align-items: center; gap: 5px; }
.sortbar { display: flex; gap: 4px; margin-bottom: 10px; }
.sortbar button { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hairline); color: var(--ink-3); }
.sortbar button.on { border-color: var(--ink-1); color: var(--ink-1); }
.rbar-list { padding: 2px 0; }
.rbar { display: grid; grid-template-columns: 180px minmax(0,1fr) minmax(90px,auto); align-items: center; gap: 12px; padding: 5px 0; border-top: 1px dashed var(--hairline); }
.rbar:first-child { border-top: none; }
.rbar:hover { background: color-mix(in srgb, var(--surface-2) 50%, transparent); }
.rbar .rn { font-family: var(--font-mono); font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rbar .track { display: flex; gap: 2px; height: 13px; }
.rbar .track div { border-radius: 3px; min-width: 3px; }
.rbar .vals { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); text-align: right; white-space: nowrap; }
.rbar .vals b { color: var(--ink-1); font-weight: 620; }
.group-cols { columns: 3 300px; column-gap: 14px; }
.db-group { break-inside: avoid; background: var(--surface-1); border: 1px solid var(--hairline); border-radius: 10px; padding: 13px 15px 14px; margin-bottom: 14px; }
.db-group.accent { border-left: 3px solid var(--slot-1); }
.db-group h4 { font-family: var(--font-mono); font-size: 11px; font-weight: 650; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
.db-group h4 .cnt { color: var(--ink-3); font-weight: 400; font-size: 10px; }
.tchips { display: flex; flex-wrap: wrap; gap: 4px; }
.tchips span { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 5px; padding: 2px 7px; }
.rt-tree details { margin-left: 14px; }
.rt-tree > details { margin-left: 0; }
.rt-tree summary { font-family: var(--font-mono); font-size: 12px; cursor: pointer; padding: 2px 0; color: var(--ink-1); list-style: none; display: flex; align-items: center; gap: 6px; }
.rt-tree summary::before { content: "▸"; font-size: 9px; color: var(--ink-3); transition: transform .12s; }
.rt-tree details[open] > summary::before { transform: rotate(90deg); }
.rt-leaf { display: flex; align-items: center; gap: 7px; padding: 2px 0 2px 15px; margin-left: 14px; }
.rt-tree > .rt-leaf { margin-left: 0; padding-left: 0; }
.rt-badge { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .08em; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--bc, var(--ink-3)); color: var(--bc, var(--ink-3)); text-transform: uppercase; }
.rt-leaf .p { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.job-list { list-style: none; }
.job-list li { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px dashed var(--hairline); }
.job-list li:first-child { border-top: none; }
.job-list .jn { font-family: var(--font-mono); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.job-list .jm { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.job-list .jbar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.job-list .jbar div { height: 100%; background: var(--slot-5); border-radius: 2px; }
.job-list li.muted .jn { color: var(--ink-3); font-weight: 450; }
.job-list li.muted .jbar div { background: var(--c-other); }
h5.subhead { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; }

#tip { position: fixed; z-index: 50; display: none; max-width: 380px; background: var(--ink-1); color: var(--page); font-family: var(--font-mono); font-size: 11px; line-height: 1.5; padding: 7px 10px; border-radius: 7px; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,.25); overflow-wrap: anywhere; }
#tip .t2 { opacity: .65; }
footer.site { border-top: 1px solid var(--hairline); padding: 18px 0 30px; margin-top: 20px; }
footer.site p { font-size: 11px; color: var(--ink-3); max-width: 900px; }
</style>
</head>

/* ---------- helpers ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const MODS = EMBED.scan.modules;
const MOD = new Map(MODS.map((m) => [m.id, m]));
const META_MOD = (EMBED.meta && EMBED.meta.modules) || {};
const fmtNum = (n) => n.toLocaleString("en-US");
const fmtLoc = (n) => n >= 10000 ? Math.round(n / 1000) + "k" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const SLOTS = ["--slot-1", "--slot-2", "--slot-3", "--slot-4", "--slot-5", "--slot-7", "--slot-8", "--slot-6"];

const tip = $("#tip");
function showTip(html, ev) { tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev) {
  const pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function tipify(el, html) {
  el.onmouseenter = (ev) => showTip(html, ev);
  el.onmousemove = moveTip;
  el.onmouseleave = hideTip;
}

/* ---------- theme ---------- */
const themeBtn = $("#themeBtn");
const THEMES = ["auto", "light", "dark"];
let theme = localStorage.getItem("cbmap-theme") || "auto";
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  themeBtn.textContent = "theme: " + theme;
  localStorage.setItem("cbmap-theme", theme);
}
themeBtn.onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(); };
applyTheme();

/* ---------- header ---------- */
document.title = `${EMBED.title} · Codebase Map`;
$("#kicker").textContent = EMBED.subtitle || "codebase atlas";
$("#pageTitle").innerHTML = `${esc(EMBED.title)} <span class="dim">/ codebase map</span>`;
$("#snapshot").textContent = `snapshot ${EMBED.generated}${EMBED.commit ? ` · ${EMBED.branch ? EMBED.branch + " @ " : ""}${EMBED.commit}` : ""}`;

const kindCounts = {};
for (const m of MODS) kindCounts[m.kind] = (kindCounts[m.kind] || 0) + 1;
const kindSummary = Object.entries(kindCounts).sort((a, b) => b[1] - a[1]).slice(0, 3)
  .map(([k, n]) => `${n} ${k}`).join(" · ");
const tiles = [
  [fmtLoc(EMBED.scan.totals.loc), "lines of code", "counted source only"],
  [fmtNum(EMBED.scan.totals.files), "source files", "see footer for scope"],
  [EMBED.scan.totals.modules, "modules", kindSummary],
  ...EMBED.facets.filter((f) => f.hero).map((f) => [f.hero.v, f.hero.l, f.hero.s || ""]),
].slice(0, 6);
$("#stats").innerHTML = tiles.map(([v, l, s]) =>
  `<div class="stat"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div><div class="s">${esc(s)}</div></div>`).join("");
$("#footNote").textContent =
  `Generated ${EMBED.generated} from a static scan${EMBED.commit ? ` @ ${EMBED.commit} (${EMBED.commitDate})` : ""}. ` +
  `Line counts cover source files only; dependency dirs, build output, and configured generated paths are excluded. ` +

const tabDefs = [
  { id: "arch", label: "Architecture" },
  { id: "files", label: "File explorer" },
  ...EMBED.facets.map((f) => ({ id: "facet-" + f.id, label: f.nav || f.title })),

$("#tabs").innerHTML = tabDefs.map((t, i) =>

function switchTab(view) {
  for (const b of $("#tabs").querySelectorAll("button")) b.setAttribute("aria-selected", String(b.dataset.view === view));
  for (const s of document.querySelectorAll("section.view")) s.classList.toggle("active", s.id === "view-" + view);
  if (view === "files") renderTreemap();
  if (view === "arch") renderGraph();
  if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view);
}
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) switchTab(b.dataset.view); });

/* =========================================================
   ARCHITECTURE GRAPH
   ========================================================= */
const stripKinds = new Set(EMBED.stripKinds);
const gnodes = MODS.filter((m) => !stripKinds.has(m.kind));
const gids = new Set(gnodes.map((n) => n.id));
const importsOf = new Map(gnodes.map((n) => [n.id, n.deps.filter((d) => gids.has(d))]));
const importedBy = new Map(gnodes.map((n) => [n.id, []]));
for (const [id, deps] of importsOf) for (const d of deps) importedBy.get(d).push(id);
const isTestOnly = (id) => !!META_MOD[id]?.testOnly;

const topKinds = new Set(EMBED.topKinds);
const layerMemo = new Map();
function layerOf(id, seen = new Set()) {
  if (layerMemo.has(id)) return layerMemo.get(id);
  if (seen.has(id)) return 0;
  seen.add(id);
  const deps = importsOf.get(id).filter((d) => !topKinds.has(MOD.get(d).kind));
  const l = deps.length ? 1 + Math.max(...deps.map((d) => layerOf(d, seen))) : 0;
  layerMemo.set(id, l);
  return l;
}
for (const n of gnodes) if (!topKinds.has(n.kind)) layerOf(n.id);
const maxBase = Math.max(0, ...[...layerMemo.values()]);
for (const n of gnodes) if (topKinds.has(n.kind)) layerMemo.set(n.id, maxBase + 1);

const rows = [];
for (const n of gnodes) {
  const l = layerMemo.get(n.id) ?? 0;
  (rows[l] = rows[l] || []).push(n);
}
for (let i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
for (const row of rows) row.sort((a, b) => b.loc - a.loc);

// barycenter ordering: nudge each row toward the mean position of its neighbors
(function orderRows() {
  const posOf = new Map();
  const refresh = () => rows.forEach((row) => row.forEach((n, i) => posOf.set(n.id, (i + 0.5) / row.length)));
  refresh();
  for (let pass = 0; pass < 4; pass++) {
    const order = pass % 2 === 0 ? rows : [...rows].reverse();
    for (const row of order) {
      row.sort((a, b) => bary(a) - bary(b));
      refresh();
    }
  }
  function bary(n) {
    const nb = [...importsOf.get(n.id), ...importedBy.get(n.id)];
    const ps = nb.map((id) => posOf.get(id)).filter((p) => p !== undefined);
    return ps.length ? ps.reduce((s, p) => s + p, 0) / ps.length : posOf.get(n.id);
  }
})();

// kind colors: top kinds first, then by aggregate loc
const kindOrder = [...new Set([
  ...EMBED.topKinds.filter((k) => kindCounts[k]),
  ...Object.keys(kindCounts).filter((k) => !stripKinds.has(k)).sort((a, b) => {
    const loc = (k) => MODS.filter((m) => m.kind === k).reduce((s, m) => s + m.loc, 0);
    return loc(b) - loc(a);
  }),
])].filter((k) => !stripKinds.has(k));
const kindColor = new Map(kindOrder.map((k, i) => [k, `var(${SLOTS[i % SLOTS.length]})`]));

$("#graphLegend").innerHTML =
  kindOrder.map((k) => `<span class="li"><span class="sw" style="background:${kindColor.get(k)}"></span> ${esc(k)}</span>`).join("") +
  (gnodes.some((n) => isTestOnly(n.id)) ? `<span class="li"><span class="sw dashed"></span> test-time only</span>` : "") +
  `<span class="li"><span class="sw line" style="background:var(--slot-1)"></span> imports (what it uses)</span>
   <span class="li"><span class="sw line" style="background:var(--slot-8)"></span> imported by (who uses it)</span>`;

const graphEl = $("#graph");
let selectedNode = null;
const ROW_H = 92, NODE_H = 46, PAD_TOP = 34, PAD_BOT = 26;

function renderGraph() {
  const W = Math.max(860, graphEl.clientWidth || graphEl.parentElement.clientWidth);
  const nLayers = rows.length;
  const H = PAD_TOP + PAD_BOT + (nLayers - 1) * ROW_H + NODE_H;
  graphEl.style.height = H + "px";
  graphEl.innerHTML = "";

  const pos = new Map();
  rows.forEach((row, layer) => {
    const y = PAD_TOP + (nLayers - 1 - layer) * ROW_H;
    const widths = row.map((n) => Math.max(100, n.dir.length * 8.4 + 52));
    const gap = 26;
    const total = widths.reduce((a, b) => a + b, 0) + gap * (row.length - 1);
    let x = Math.max(64, (W - total) / 2);
    row.forEach((n, i) => { pos.set(n.id, { x, y, w: widths[i] }); x += widths[i] + gap; });
  });

  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const edgeEls = [];
  for (const [from, deps] of importsOf) {
    const a = pos.get(from);
    for (const to of deps) {
      const b = pos.get(to);
      if (!a || !b) continue;
      const x1 = a.x + a.w / 2, y1 = a.y + NODE_H, x2 = b.x + b.w / 2, y2 = b.y;
      const dy = Math.max(34, (y2 - y1) * 0.45);
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`);
      p.dataset.from = from; p.dataset.to = to;
      svg.appendChild(p);
      edgeEls.push(p);
    }
  }
  graphEl.appendChild(svg);

  rows.forEach((row, layer) => {
    if (!row.length) return;
    const y = PAD_TOP + (nLayers - 1 - layer) * ROW_H;
    const lab = document.createElement("div");
    lab.className = "row-label";
    lab.style.top = (y + NODE_H / 2 - 6) + "px";
    const kinds = [...new Set(row.map((n) => n.kind))];
    lab.textContent = layer === nLayers - 1 && EMBED.topKinds.length && kinds.every((k) => topKinds.has(k))
      ? kinds.join("·") : "L" + layer;
    graphEl.appendChild(lab);
  });

  const nodeEls = new Map();
  for (const n of gnodes) {
    const p = pos.get(n.id);
    if (!p) continue;
    const el = document.createElement("div");
    el.className = "gnode" + (isTestOnly(n.id) ? " testpkg" : "");
    el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;--kc:${kindColor.get(n.kind) || "var(--c-other)"}`;
    el.innerHTML = `<span class="gname">${esc(n.dir)}</span><span class="gmeta">${fmtLoc(n.loc)} loc</span>`;
    el.onmouseenter = (ev) => { focusNode(n.id); showTip(nodeTip(n), ev); };
    el.onmousemove = moveTip;
    el.onmouseleave = () => { hideTip(); focusNode(selectedNode); };
    el.onclick = (ev) => { ev.stopPropagation(); selectNode(n.id); };
    graphEl.appendChild(el);
    nodeEls.set(n.id, el);
  }
  graphEl._edgeEls = edgeEls;
  graphEl._nodeEls = nodeEls;
  focusNode(selectedNode);
}

function nodeTip(n) {
  return `<b>${esc(n.name)}</b><br>` +
    `<span class="t2">${fmtNum(n.loc)} loc · ${fmtNum(n.files)} files · ${fmtNum(n.commits)} commits (${esc(EMBED.scan.since)})</span><br>` +
    `<span class="t2">imports ${importsOf.get(n.id).length} · imported by ${importedBy.get(n.id).length} — click for details</span>`;
}

function focusNode(id) {
  const edgeEls = graphEl._edgeEls || [], nodeEls = graphEl._nodeEls || new Map();
  graphEl.classList.toggle("focused", !!id);
  if (!id) {
    for (const p of edgeEls) p.classList.remove("is-imports", "is-imported");
    for (const el of nodeEls.values()) el.classList.remove("dimmed");
    for (const [nid, el] of nodeEls) el.classList.toggle("selected", nid === selectedNode);
    return;
  }
  const related = new Set([id, ...importsOf.get(id), ...importedBy.get(id)]);
  for (const p of edgeEls) {
    p.classList.toggle("is-imports", p.dataset.from === id);
    p.classList.toggle("is-imported", p.dataset.to === id);
  }
  for (const [nid, el] of nodeEls) {
    el.classList.toggle("dimmed", !related.has(nid));
    el.classList.toggle("selected", nid === selectedNode);
  }
}

function selectNode(id) { selectedNode = id; focusNode(id); renderArchPanel(id); }

function squarify(children, x, y, w, h, out) {
  const items = children.filter((c) => c.v > 0);
  const total = items.reduce((s, c) => s + c.v, 0);
  if (!total || w <= 2 || h <= 2) return out;
  const scale = (w * h) / total;
  const areas = items.map((c) => ({ node: c, area: c.v * scale }));
  let cx = x, cy = y, cw = w, ch = h, row = [];
  const worst = (r, side) => {
    const s = r.reduce((a, b) => a + b.area, 0);
    let mx = 0, mn = Infinity;
    for (const it of r) { if (it.area > mx) mx = it.area; if (it.area < mn) mn = it.area; }
    return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
  };
  const layoutRow = (r) => {
    const s = r.reduce((a, b) => a + b.area, 0);
    if (cw >= ch) {
      const rw = s / ch; let yy = cy;
      for (const it of r) { const hh = it.area / rw; out.push({ node: it.node, x: cx, y: yy, w: rw, h: hh }); yy += hh; }
      cx += rw; cw -= rw;
    } else {
      const rh = s / cw; let xx = cx;
      for (const it of r) { const ww = it.area / rh; out.push({ node: it.node, x: xx, y: cy, w: ww, h: rh }); xx += ww; }
      cy += rh; ch -= rh;
    }
  };
  let i = 0;
  while (i < areas.length) {
    const side = Math.min(cw, ch);
    if (row.length === 0 || worst([...row, areas[i]], side) <= worst(row, side)) { row.push(areas[i]); i++; }
    else { layoutRow(row); row = []; }
  }
  if (row.length) layoutRow(row);
  return out;
}

function currentRoot() {
  let node = MOD.get(tmState.pkg).tree;
  for (const name of tmState.path) {
    const next = (node.c || []).find((c) => c.n === name && c.c);
    if (!next) break;
    node = next;
  }
  return node;
}

function cellTip(node, segs, pctBase) {
  const pct = pctBase ? ` · ${((node.v / pctBase) * 100).toFixed(1)}% of view` : "";
  if (node.c) return `<b>${esc(segs.join("/"))}/</b><br><span class="t2">${fmtNum(node.v)} loc · ${fmtNum(node.f)} files${pct} — click to zoom</span>`;
  return `<b>${esc(segs.join("/"))}</b><br><span class="t2">${fmtNum(node.v)} loc${pct}</span>`;
}

function renderTreemap() {
  if (!tmEl.clientWidth) return;
  const root = currentRoot();
  const W = tmEl.clientWidth, H = tmEl.clientHeight;
  tmEl.innerHTML = "";
  const viewTotal = root.v;

  const mkFileCell = (r, node, segs, parent) => {
    const el = document.createElement("div");
    const t = typeOf(node.e);
    el.className = "tm-cell tm-file" + (isTestFile(node.n, segs) ? " hatched" : "");
    el.dataset.type = t;
    el.style.cssText = `left:${r.x + 1}px;top:${r.y + 1}px;width:${Math.max(1, r.w - 2)}px;height:${Math.max(1, r.h - 2)}px;background-color:var(${TYPE_VAR[t]})`;
    if (r.w > 56 && r.h > 17) el.innerHTML = `<span class="lbl">${esc(node.n)}</span>`;
    tipify(el, cellTip(node, segs, viewTotal));
    parent.appendChild(el);
  };
  const mkDirCell = (r, node, segs, pathNames, parent) => {
    const el = document.createElement("div");
    el.className = "tm-cell tm-dircell";
    el.style.cssText = `left:${r.x + 1}px;top:${r.y + 1}px;width:${Math.max(1, r.w - 2)}px;height:${Math.max(1, r.h - 2)}px`;
    if (r.w > 56 && r.h > 17) el.innerHTML = `<span class="lbl">${esc(node.n)}/</span>`;
    tipify(el, cellTip(node, segs, viewTotal));
    el.onclick = (ev) => { ev.stopPropagation(); tmState.path = pathNames; renderTreemap(); };
    parent.appendChild(el);
  };

  function renderChildren(node, parent, w, h, segs, pathNames, depth) {
    const inset = depth === 0 ? 4 : 1;
    const rects = squarify(node.c || [], inset, inset, w - inset * 2, h - inset * 2, []);
    for (const r of rects) {
      const ch = r.node;
      const chSegs = [...segs, ch.n];
      if (!ch.c) { mkFileCell(r, ch, chSegs, parent); continue; }
      const chPath = [...pathNames, ch.n];
      if (r.w < 90 || r.h < 64) { mkDirCell(r, ch, chSegs, chPath, parent); continue; }
      const g = document.createElement("div");
      g.className = "tm-group";
      g.style.cssText = `left:${r.x + 1}px;top:${r.y + 1}px;width:${r.w - 2}px;height:${r.h - 2}px`;
      g.innerHTML = `<div class="hd">${esc(ch.n)}/ <span style="opacity:.55;font-weight:400">${fmtLoc(ch.v)}</span></div><div class="body"></div>`;
      const hd = g.querySelector(".hd");
      hd.onclick = (ev) => { ev.stopPropagation(); tmState.path = chPath; renderTreemap(); };
      tipify(hd, cellTip(ch, chSegs, viewTotal));
      parent.appendChild(g);
      renderChildren(ch, g.querySelector(".body"), r.w - 2, r.h - 2 - 17, chSegs, chPath, depth + 1);
    }
  }
  renderChildren(root, tmEl, W, H, [], tmState.path, 0);

  const hint = document.createElement("div");
  hint.className = "tm-hint";
  hint.textContent = "area = lines of code";
  tmEl.appendChild(hint);

  renderCrumbs();
  renderTmSidebar(root);
}

function renderCrumbs() {
  const c = $("#crumbs");
  const parts = [MOD.get(tmState.pkg).dir, ...tmState.path];
  c.innerHTML = parts.map((p, i) =>
    i === parts.length - 1
      ? `<span class="here">${esc(p)}</span>`
      : `<button data-i="${i}">${esc(p)}</button><span class="sep">/</span>`).join("");
  c.querySelectorAll("button").forEach((b) => (b.onclick = () => { tmState.path = tmState.path.slice(0, +b.dataset.i); renderTreemap(); }));
}

function collectFiles(node, prefix, out) {
  for (const ch of node.c || []) {
    if (ch.c) collectFiles(ch, prefix ? prefix + "/" + ch.n : ch.n, out);
    else out.push({ path: prefix ? prefix + "/" + ch.n : ch.n, v: ch.v, e: ch.e });
  }
  return out;
}

const BADGE_SLOTS = ["--slot-1", "--slot-8", "--slot-2", "--slot-5", "--slot-3"];

function renderSection(sec, host) {
  const card = document.createElement("div");
  const bare = sec.kind === "tiles";
  card.className = bare ? "" : "facet-card";
  if (!bare && sec.title) card.innerHTML = `<h3>${esc(sec.title)}</h3>${sec.sub ? `<div class="sub">${escBadges(sec.sub, sec)}</div>` : ""}`;
  host.appendChild(card);
  const body = document.createElement("div");
  card.appendChild(body);

  if (sec.kind === "tiles") {
    body.className = "tiles-row";
    body.innerHTML = (sec.tiles || []).map((t) =>
      `<div class="tile"><div class="v">${esc(t.v)}</div><div class="l">${esc(t.l)}</div><div class="s">${esc(t.s || "")}</div></div>`).join("");
  } else if (sec.kind === "barlist") {
    renderBarlist(sec, body);
  } else if (sec.kind === "groups") {
    body.className = "group-cols";
    body.innerHTML = (sec.groups || []).map((g) =>
      `<div class="db-group${g.accent ? " accent" : ""}"><h4>${esc(g.title)} <span class="cnt">${(g.chips || []).length}</span></h4>
       <div class="tchips">${(g.chips || []).map((c) => `<span>${esc(c)}</span>`).join("")}</div></div>`).join("");
  } else if (sec.kind === "tree") {
    body.className = "rt-tree";
    const badgeColor = badgeColors(sec);
    const renderNode = (item, depth) => {
      const badge = item.badge ? `<span class="rt-badge" style="--bc:var(${badgeColor(item.badge)})">${esc(item.badge)}</span>` : "";
      if (!item.children?.length) return `<div class="rt-leaf"><span class="p">${esc(item.label)}</span>${badge}</div>`;
      return `<details${depth < 1 ? " open" : ""}><summary>${esc(item.label)}${badge ? " " + badge : ""}</summary>` +
        item.children.map((c) => renderNode(c, depth + 1)).join("") + `</details>`;
    };
    body.innerHTML = (sec.items || []).map((i) => renderNode(i, 0)).join("");
  } else if (sec.kind === "loclist") {
    body.innerHTML = "";
    const ul = document.createElement("ul");
    ul.className = "job-list";
    const max = Math.max(1, ...(sec.rows || []).map((r) => r.bar ?? 0));
    let html = "";
    for (const r of sec.rows || []) {
      if (r.section) { html += `</ul><h5 class="subhead">${esc(r.section)}</h5><ul class="job-list">`; continue; }
      html += `<li${r.muted ? ` class="muted"` : ""}>
        <span class="jn">${esc(r.label)}</span>
        <span class="jm">${esc(r.meta || "")}</span>
        ${r.bar != null ? `<span class="jbar"><div style="width:${((r.bar / max) * 100).toFixed(1)}%"></div></span>` : ""}
      </li>`;
    }
    body.innerHTML = `<ul class="job-list">${html}</ul>`;
  }
}

function badgeColors(sec) {
  const seen = new Map();
  (function scan(items) {
    for (const i of items || []) {
      if (i.badge && !seen.has(i.badge)) seen.set(i.badge, BADGE_SLOTS[seen.size % BADGE_SLOTS.length]);
      scan(i.children);
    }
  })(sec.items);
  return (b) => seen.get(b) || "--c-other";
}
function escBadges(s) { return esc(s); }

function renderBarlist(sec, body) {
  const series = sec.series || [];
  body.innerHTML =
    `<div class="chart-legend">${series.map((s, i) =>
      `<span class="li"><span class="sw" style="background:var(${SLOTS[i % SLOTS.length]})"></span>${esc(s.label)}</span>`).join("")}
      ${sec.note ? `<span class="li" style="color:var(--ink-3)">${esc(sec.note)}</span>` : ""}</div>
     <div class="sortbar"><button data-k="value" class="on">by value</button><button data-k="name">a–z</button></div>
     <div class="rbar-list"></div>`;
  const list = body.querySelector(".rbar-list");
  const total = (r) => series.reduce((s, sr) => s + (r.values[sr.k] || 0), 0);
  let sortKey = "value";
  const draw = () => {
    const rows = [...(sec.rows || [])];
    if (sortKey === "value") rows.sort((a, b) => total(b) - total(a));
    else rows.sort((a, b) => a.label.localeCompare(b.label));
    const max = Math.max(1, ...rows.map(total));
    list.innerHTML = rows.map((r) => {
      const segs = series.map((sr, i) => {
        const v = r.values[sr.k] || 0;
        return v ? `<div style="width:${((v / max) * 100).toFixed(2)}%;background:var(${SLOTS[i % SLOTS.length]})"></div>` : "";
      }).join("");
      return `<div class="rbar" data-label="${esc(r.label)}">
        <div class="rn">${esc(r.label)}</div>
        <div class="track">${segs}</div>
        <div class="vals"><b>${total(r)}</b>${r.meta ? ` · ${esc(r.meta)}` : ""}</div>
      </div>`;
    }).join("");
    list.querySelectorAll(".rbar").forEach((el) => {
      const r = (sec.rows || []).find((x) => x.label === el.dataset.label);
      if (r?.tip) tipify(el, esc(r.tip));
    });
  };
  body.querySelector(".sortbar").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    sortKey = b.dataset.k;
    body.querySelectorAll(".sortbar button").forEach((x) => x.classList.toggle("on", x === b));
    draw();
  });
  draw();
}

const facetHost = $("#facetViews");
for (const f of EMBED.facets) {
  const sec = document.createElement("section");
  sec.className = "view";
  sec.id = "view-facet-" + f.id;
  sec.innerHTML = `<div class="view-head"><h2>${esc(f.title)}${f.headline ? ` — <span style="font-weight:400">${esc(f.headline)}</span>` : ""}</h2>
    ${f.sub ? `<div class="sub">${esc(f.sub)}</div>` : ""}</div>`;
  const grid = document.createElement("div");
  grid.className = "facet-grid" + (f.columns === 2 ? " cols-2" : "");
  sec.appendChild(grid);
  for (const s of f.sections || []) renderSection(s, grid);
  facetHost.appendChild(sec);
}
