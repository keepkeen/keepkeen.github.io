<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">从原始数据到 Hugging Face 模型的完整流程</title>
  <desc id="desc">原始数据依次经过数据集整理、Schema 和 Reward 检查、短训练、正式训练、分片 checkpoint、模型合并、Hugging Face 验证和最终评测服务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="arrow-fill"/></marker>
    <style>
      .node{fill:#f8fafc;stroke:#64748b;stroke-width:2}.accent{fill:#eef2ff;stroke:#6366f1}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.arrow-fill{fill:#64748b}.label{fill:#0f172a;font:600 20px system-ui,sans-serif;text-anchor:middle}.sub{fill:#475569;font:15px system-ui,sans-serif;text-anchor:middle}.step{fill:#6366f1;font:700 15px system-ui,sans-serif;text-anchor:middle}
      @media(prefers-color-scheme:dark){.node{fill:#172033;stroke:#94a3b8}.accent{fill:#252449;stroke:#a5b4fc}.line{stroke:#94a3b8}.arrow-fill{fill:#94a3b8}.label{fill:#f8fafc}.sub{fill:#cbd5e1}.step{fill:#a5b4fc}}
    </style>
  </defs>
  <g>
    <rect class="node" x="55" y="45" width="290" height="100" rx="16"/><text class="step" x="90" y="72">01</text><text class="label" x="200" y="92">原始数据</text><text class="sub" x="200" y="119">问题、答案、工具与图像</text>
    <rect class="node" x="455" y="45" width="290" height="100" rx="16"/><text class="step" x="490" y="72">02</text><text class="label" x="600" y="92">Parquet / HF Dataset</text><text class="sub" x="600" y="119">标准化训练 schema</text>
    <rect class="node" x="855" y="45" width="290" height="100" rx="16"/><text class="step" x="890" y="72">03</text><text class="label" x="1000" y="92">Dry-run</text><text class="sub" x="1000" y="119">模板、Mask、Reward、分组</text>
    <rect class="accent node" x="855" y="255" width="290" height="100" rx="16"/><text class="step" x="890" y="282">04</text><text class="label" x="1000" y="302">Smoke Training</text><text class="sub" x="1000" y="329">2～5 step 全链验证</text>
    <rect class="accent node" x="455" y="255" width="290" height="100" rx="16"/><text class="step" x="490" y="282">05</text><text class="label" x="600" y="302">正式训练</text><text class="sub" x="600" y="329">指标、Validation、恢复演练</text>
    <rect class="node" x="55" y="255" width="290" height="100" rx="16"/><text class="step" x="90" y="282">06</text><text class="label" x="200" y="302">分片 Checkpoint</text><text class="sub" x="200" y="329">FSDP / Megatron 状态</text>
    <rect class="node" x="55" y="465" width="290" height="100" rx="16"/><text class="step" x="90" y="492">07</text><text class="label" x="200" y="512">Model Merger</text><text class="sub" x="200" y="539">按 checkpoint layout 导出</text>
    <rect class="node" x="455" y="465" width="290" height="100" rx="16"/><text class="step" x="490" y="492">08</text><text class="label" x="600" y="512">HF 模型验证</text><text class="sub" x="600" y="539">配置、Logits、Generation</text>
    <rect class="accent node" x="855" y="465" width="290" height="100" rx="16"/><text class="step" x="890" y="492">09</text><text class="label" x="1000" y="512">评测 / 服务</text><text class="sub" x="1000" y="539">独立 benchmark 与上线</text>
  </g>
  <path class="line" d="M345 95H455"/><path class="line" d="M745 95H855"/><path class="line" d="M1000 145V255"/>
  <path class="line" d="M855 305H745"/><path class="line" d="M455 305H345"/><path class="line" d="M200 355V465"/>
  <path class="line" d="M345 515H455"/><path class="line" d="M745 515H855"/>
</svg>
