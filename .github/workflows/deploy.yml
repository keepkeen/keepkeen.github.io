name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts and pinned ebook tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-core libxml2-utils openjdk-21-jre-headless unzip
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb -o "$RUNNER_TEMP/pandoc.deb"
          sudo apt-get install -y -qq "$RUNNER_TEMP/pandoc.deb"
          curl -fsSL https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip -o "$RUNNER_TEMP/epubcheck.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-5.3.0/epubcheck.jar" >> "$GITHUB_ENV"
          pandoc --version | head -1
          java -jar "$RUNNER_TEMP/epubcheck-5.3.0/epubcheck.jar" --version

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Syntax-check gateway
        run: node --check gateway/server.mjs

      - name: Build and validate Kindle ebooks
        run: |
          npm run build:ebooks
          npm run validate:ebooks

      - name: Build site
        env:
          PUBLIC_SHOW_STUDIO: ${{ vars.PUBLIC_SHOW_STUDIO }}
          PUBLIC_STUDIO_GATEWAY_URL: ${{ vars.PUBLIC_STUDIO_GATEWAY_URL }}
        run: npm run build

      - name: Report dist size
        run: |
          echo "dist summary"
          du -sh dist
          du -sh dist/* 2>/dev/null | sort -hr | head -20
          find dist/_astro -type f -exec du -h {} + 2>/dev/null | sort -hr | head -15 || true

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
