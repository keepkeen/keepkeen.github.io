name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts for social-card rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-core

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Syntax-check gateway
        run: node --check gateway/server.mjs

      - name: Build site
        env:
          PUBLIC_SHOW_STUDIO: ${{ vars.PUBLIC_SHOW_STUDIO }}
          PUBLIC_STUDIO_GATEWAY_URL: ${{ vars.PUBLIC_STUDIO_GATEWAY_URL }}
        run: npm run build

      - name: Report dist size
        run: |
          echo "dist summary"
          du -sh dist
          du -sh dist/* 2>/dev/null | sort -hr | head -20
          find dist/_astro -type f -exec du -h {} + 2>/dev/null | sort -hr | head -15 || true

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
