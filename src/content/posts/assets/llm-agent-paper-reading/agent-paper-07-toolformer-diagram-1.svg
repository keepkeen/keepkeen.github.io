<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Toolformer 训练与推理机制</title>
  <desc id="desc">训练阶段从普通文本采样工具调用位置和参数，执行工具，以未来词预测损失差筛选调用并微调；推理阶段模型生成调用标记后暂停，由外部工具返回结果，再继续生成。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .lane{font:700 22px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .head{font:700 17px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .body{font:14px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}
      .tiny{font:13px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475569}
      .box{stroke-width:2;rx:14;ry:14}
      .flow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .tool{fill:none;stroke:#ea580c;stroke-width:3;stroke-dasharray:9 6;marker-end:url(#arrow-orange)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="55" y="50" class="title">Toolformer：先让模型提议调用，再用“未来词是否更好预测”筛选训练数据</text>

  <text x="55" y="105" class="lane">训练阶段</text>
  <rect x="55" y="130" width="190" height="125" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="77" y="167" class="head">① 普通文本 x</text>
  <text x="77" y="197" class="body">少量 API 示范作提示</text>
  <text x="77" y="222" class="tiny">原文没有调用标注</text>

  <rect x="285" y="130" width="210" height="125" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="307" y="167" class="head">② 采样候选</text>
  <text x="307" y="197" class="body">位置 i、工具 a、参数 iᶜ</text>
  <text x="307" y="222" class="tiny">阈值 τₛ + top-k</text>

  <rect x="535" y="130" width="190" height="125" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="557" y="167" class="head">③ 执行工具</text>
  <text x="557" y="197" class="body">得到文本结果 r</text>
  <text x="557" y="222" class="tiny">计算器 / 检索 / 翻译…</text>

  <rect x="765" y="110" width="200" height="165" class="box" fill="#fefce8" stroke="#ca8a04"/>
  <text x="787" y="147" class="head">④ 反事实损失比较</text>
  <text x="787" y="180" class="body">有结果：L⁺</text>
  <text x="787" y="205" class="body">无结果/无调用：L⁻</text>
  <text x="787" y="237" class="tiny">保留 L⁻ − L⁺ ≥ τ𝒇</text>

  <rect x="1005" y="130" width="150" height="125" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="1026" y="167" class="head">⑤ 微调</text>
  <text x="1026" y="197" class="body">构造 C*</text>
  <text x="1026" y="222" class="tiny">标准语言模型目标</text>

  <path d="M245 192 L285 192" class="flow"/><path d="M495 192 L535 192" class="flow"/>
  <path d="M725 192 L765 192" class="tool"/><path d="M965 192 L1005 192" class="flow"/>

  <rect x="55" y="302" width="1100" height="86" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="80" y="334" class="head">筛选器真正优化什么？</text>
  <text x="80" y="363" class="body">工具结果若能降低紧邻未来词的加权交叉熵，就被当作“对模型有用”的伪标签；它不直接判断答案真伪、调用成本或任务成功。</text>

  <line x1="55" y1="430" x2="1155" y2="430" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="478" class="lane">推理阶段</text>

  <rect x="80" y="510" width="250" height="125" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="105" y="547" class="head">模型常规生成</text>
  <text x="105" y="577" class="body">文本 → &lt;API&gt;工具(参数) →</text>
  <text x="105" y="605" class="tiny">出现箭头 token 时暂停</text>

  <rect x="475" y="510" width="250" height="125" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="500" y="547" class="head">宿主执行一次工具</text>
  <text x="500" y="577" class="body">获得 r 并插入 &lt;/API&gt;</text>
  <text x="500" y="605" class="tiny">论文评测最多一次调用</text>

  <rect x="870" y="510" width="250" height="125" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="895" y="547" class="head">模型继续生成</text>
  <text x="895" y="577" class="body">以工具返回为新前缀</text>
  <text x="895" y="605" class="tiny">完成余下文本 / 答案</text>

  <path d="M330 572 L475 572" class="tool"/><path d="M725 572 L870 572" class="flow"/>
  <path d="M995 635 C995 700 205 700 205 635" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="390" y="728" class="tiny">能力边界：训练调用彼此独立，论文系统不会把一个工具输出继续喂给另一个工具，也不会交互式改写检索。</text>
</svg>
