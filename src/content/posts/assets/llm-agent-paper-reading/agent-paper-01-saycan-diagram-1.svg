<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
  <title id="title">SayCan 的问题、机制与反馈回路</title>
  <desc id="desc">左侧对比只用语言模型的失败和只用机器人策略的限制，中间展示语言得分与可供性得分相乘选技能，右侧展示执行后更新状态并重新决策。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .h1{font:700 30px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#101828}
      .h2{font:700 22px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#101828}
      .body{font:18px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#344054}
      .small{font:16px -apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#475467}
      .mono{font:17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#101828}
      .box{stroke:#98a2b3;stroke-width:2;rx:16}
      .flow{stroke:#344054;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .feedback{stroke:#2563eb;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#arrow-blue)}
    </style>
  </defs>

  <rect width="1360" height="820" fill="#f8fafc"/>
  <text x="54" y="52" class="h1">SayCan：把“该做什么”与“现在能做什么”合并</text>

  <rect x="48" y="82" width="320" height="610" fill="#fff7ed" class="box" stroke="#fb923c"/>
  <text x="72" y="122" class="h2">1. 观察到的失败</text>
  <rect x="72" y="151" width="272" height="145" fill="#ffffff" class="box"/>
  <text x="92" y="184" class="body">只用 LLM</text>
  <text x="92" y="217" class="small">语义合理：“用吸尘器”</text>
  <text x="92" y="247" class="small">但现场没有吸尘器，</text>
  <text x="92" y="275" class="small">机器人也没有该技能。</text>
  <rect x="72" y="325" width="272" height="145" fill="#ffffff" class="box"/>
  <text x="92" y="358" class="body">只用低层策略</text>
  <text x="92" y="391" class="small">会执行“拿海绵”，</text>
  <text x="92" y="421" class="small">却不知道“饮料洒了”</text>
  <text x="92" y="449" class="small">需要哪些步骤以及顺序。</text>
  <rect x="72" y="508" width="272" height="132" fill="#ffedd5" class="box" stroke="#fb923c"/>
  <text x="92" y="543" class="body">核心缺口</text>
  <text x="92" y="577" class="small">语义先验缺少身体状态；</text>
  <text x="92" y="607" class="small">身体能力缺少高层目标。</text>

  <rect x="400" y="82" width="560" height="610" fill="#eff6ff" class="box" stroke="#60a5fa"/>
  <text x="424" y="122" class="h2">2. 并行打分，再贪心选一步</text>
  <rect x="432" y="151" width="222" height="118" fill="#ffffff" class="box"/>
  <text x="453" y="185" class="body">任务接地（Say）</text>
  <text x="453" y="220" class="small">LLM 评估候选技能</text>
  <text x="453" y="248" class="mono">p(技能文字 | 指令,历史)</text>
  <rect x="705" y="151" width="222" height="118" fill="#ffffff" class="box"/>
  <text x="726" y="185" class="body">世界接地（Can）</text>
  <text x="726" y="220" class="small">价值/可供性评估</text>
  <text x="726" y="248" class="mono">p(成功 | 状态,技能)</text>
  <path d="M 545 270 L 610 323" class="flow"/>
  <path d="M 816 270 L 750 323" class="flow"/>
  <rect x="540" y="323" width="280" height="112" fill="#dbeafe" class="box" stroke="#2563eb"/>
  <text x="571" y="360" class="body">对每个候选技能相乘</text>
  <text x="570" y="400" class="mono">score = pLLM × paffordance</text>
  <path d="M 680 436 L 680 480" class="flow"/>
  <rect x="500" y="481" width="360" height="132" fill="#ffffff" class="box"/>
  <text x="522" y="518" class="body">选择得分最高的技能</text>
  <text x="522" y="554" class="small">例：找海绵 → 拿海绵 → 送给用户</text>
  <text x="522" y="586" class="small">若“done”最高，则结束。</text>

  <rect x="992" y="82" width="320" height="610" fill="#ecfdf3" class="box" stroke="#4ade80"/>
  <text x="1016" y="122" class="h2">3. 执行与反馈</text>
  <rect x="1016" y="151" width="272" height="112" fill="#ffffff" class="box"/>
  <text x="1037" y="187" class="body">执行选中的低层技能</text>
  <text x="1037" y="223" class="small">策略控制手臂/底盘。</text>
  <path d="M 1152 264 L 1152 315" class="flow"/>
  <rect x="1016" y="316" width="272" height="112" fill="#ffffff" class="box"/>
  <text x="1037" y="352" class="body">环境状态变为 s(n+1)</text>
  <text x="1037" y="388" class="small">同时把已选技能追加到</text>
  <text x="1037" y="416" class="small">LLM 的文本历史。</text>
  <path d="M 1152 429 L 1152 479" class="flow"/>
  <rect x="1016" y="480" width="272" height="132" fill="#dcfce7" class="box" stroke="#22c55e"/>
  <text x="1037" y="518" class="body">在新状态下重新打分</text>
  <text x="1037" y="554" class="small">每一轮都能让“Can”反映</text>
  <text x="1037" y="584" class="small">物体、位置和夹持状态的变化。</text>

  <path d="M 1016 548 C 935 730, 520 744, 474 613" class="feedback"/>
  <rect x="575" y="728" width="690" height="34" rx="6" fill="#f8fafc" opacity="0.94"/>
  <text x="598" y="751" class="small" fill="#2563eb">虚线：下一轮控制回路（重新读取状态，不是训练 LLM）</text>
  <text x="50" y="798" class="small">实线箭头：当前轮的信息/控制流。颜色之外同时用实线与虚线区分语义。</text>
</svg>
