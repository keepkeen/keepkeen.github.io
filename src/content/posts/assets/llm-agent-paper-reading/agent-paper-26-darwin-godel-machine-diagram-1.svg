<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DGM：档案驱动的自修改与经验选择</title>
  <desc id="desc">展示父代抽样、日志诊断、自修改、分阶段评估、有效后代入档案，以及无效和指标钻空子失败路径。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.box-title{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}
      .box{stroke-width:2;rx:14}.flow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.control{stroke:#475569;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow-gray)}.fail{stroke:#dc2626;stroke-width:2.5;stroke-dasharray:5 5;fill:none;marker-end:url(#arrow-red)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="54" class="title">DGM：档案驱动的自修改与经验选择</text>
  <text x="60" y="82" class="subtitle">对象是冻结基础模型外的智能体代码；开放式搜索器本身保持固定</text>

  <rect x="55" y="140" width="230" height="170" class="box" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="75" y="174" class="box-title">① 谱系档案 Aᵗ</text>
  <text x="75" y="204" class="body">• 代码版本与父子关系</text>
  <text x="75" y="230" class="body">• 基准成功率 αᵢ</text>
  <text x="75" y="256" class="body">• 有效子代数量 nᵢ</text>
  <text x="75" y="286" class="small">保留可编辑版本，包括暂时低分者</text>

  <rect x="345" y="140" width="210" height="170" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="365" y="174" class="box-title">② 抽取父代</text>
  <text x="365" y="205" class="body">性能：sᵢ = sigmoid(αᵢ)</text>
  <text x="365" y="231" class="body">探索：hᵢ = 1/(1+nᵢ)</text>
  <text x="365" y="257" class="body">概率：pᵢ ∝ sᵢhᵢ</text>
  <text x="365" y="286" class="small">高分、少子代者更常被抽中</text>

  <rect x="615" y="140" width="225" height="170" class="box" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="635" y="174" class="box-title">③ 日志诊断</text>
  <text x="635" y="204" class="body">额外模型读取失败轨迹</text>
  <text x="635" y="230" class="body">提出一项通用改进</text>
  <text x="635" y="256" class="body">输出问题与实现建议</text>
  <text x="635" y="286" class="small">敏感点：诊断输入含评估反馈</text>

  <rect x="900" y="140" width="240" height="170" class="box" fill="#ecfdf5" stroke="#15803d"/>
  <text x="920" y="174" class="box-title">④ 父代自修改</text>
  <text x="920" y="204" class="body">复制自己的代码仓库</text>
  <text x="920" y="230" class="body">改工具、提示或工作流</text>
  <text x="920" y="256" class="body">得到子代 c</text>
  <text x="920" y="286" class="small">基础模型权重不更新</text>

  <path d="M285 225 H345" class="control"/>
  <path d="M555 225 H615" class="control"/>
  <path d="M840 225 H900" class="flow"/>

  <rect x="730" y="390" width="300" height="150" class="box" fill="#fff7ed" stroke="#c2410c"/>
  <text x="750" y="425" class="box-title">⑤ 分阶段执行评估</text>
  <text x="750" y="455" class="body">编译 / 基本代码编辑检查</text>
  <text x="750" y="481" class="body">10 → 50 →（SWE 强候选）200 题</text>
  <text x="750" y="510" class="small">分数既用于选择，也报告最终最佳者</text>
  <path d="M1020 310 V350 Q1020 365 1005 365 H895 Q880 365 880 390" class="flow"/>

  <rect x="350" y="390" width="290" height="150" class="box" fill="#f1f5f9" stroke="#475569"/>
  <text x="370" y="425" class="box-title">⑥ 有效后代入档案</text>
  <text x="370" y="455" class="body">保存代码 diff、分数、父节点</text>
  <text x="370" y="481" class="body">下一轮可从任一有效谱系分叉</text>
  <text x="370" y="510" class="small">反馈闭环：新工具也参与未来自修改</text>
  <path d="M730 465 H640" class="flow"/>
  <path d="M350 465 H185 Q150 465 150 430 V310" class="flow"/>

  <rect x="890" y="595" width="250" height="75" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="910" y="625" class="box-title" fill="#991b1b">失败路径</text>
  <text x="910" y="649" class="body">失去编辑能力 → 丢弃</text>
  <path d="M960 540 V595" class="fail"/>

  <rect x="560" y="595" width="270" height="75" class="box" fill="#fff1f2" stroke="#be123c"/>
  <text x="580" y="625" class="box-title" fill="#9f1239">评估器失配</text>
  <text x="580" y="649" class="body">高分但钻指标空子 → 人工审计</text>
  <path d="M820 540 Q800 570 750 595" class="fail"/>

  <g transform="translate(55,610)">
    <text x="0" y="0" class="box-title">图例</text>
    <line x1="0" y1="28" x2="55" y2="28" class="flow"/><text x="70" y="33" class="body">代码 / 评估数据流</text>
    <line x1="0" y1="57" x2="55" y2="57" class="control"/><text x="70" y="62" class="body">抽样控制流</text>
    <line x1="270" y1="57" x2="325" y2="57" class="fail"/><text x="340" y="62" class="body">失败或审计路径</text>
  </g>
</svg>
