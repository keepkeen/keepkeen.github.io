<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">GenericAgent：有限上下文中的信息预算闭环</title>
  <desc id="desc">任务输入经过分层记忆、模型决策、九类工具执行和验证反馈；成功轨迹形成记忆，预算控制压缩上下文，未验证写入或过度压缩进入失败路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#315f79"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b84a4a"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#17384d}.sub{font:15px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#526b79}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#17384d}.t{font:15px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#294b5d}.small{font:13px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#526b79}.box{fill:#f4f8fa;stroke:#77a0b5;stroke-width:2}.memory{fill:#eef5ff;stroke:#5988bd;stroke-width:2}.action{fill:#eef9f2;stroke:#5d9972;stroke-width:2}.control{fill:#fff7e8;stroke:#d29a3a;stroke-width:2}.fail{fill:#fff0ef;stroke:#c45b55;stroke-width:2}.line{fill:none;stroke:#315f79;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#b84a4a;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowRed)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="55" class="title">GenericAgent：有限上下文中的信息预算闭环</text>
  <text x="60" y="82" class="sub">蓝色＝状态/决策　绿色＝外部动作　橙色＝预算控制　红色虚线＝失效路径</text>

  <rect x="60" y="145" rx="16" ry="16" width="180" height="120" class="box"/>
  <text x="150" y="180" text-anchor="middle" class="h">任务输入</text>
  <text x="150" y="210" text-anchor="middle" class="t">用户目标</text>
  <text x="150" y="235" text-anchor="middle" class="t">约束与环境</text>

  <rect x="290" y="125" rx="16" ry="16" width="235" height="160" class="memory"/>
  <text x="407" y="158" text-anchor="middle" class="h">分层状态</text>
  <text x="315" y="190" class="t">工作记忆：当前检查点</text>
  <text x="315" y="217" class="t">常驻记忆：高频原则</text>
  <text x="315" y="244" class="t">长期记忆：L1 → L2/L3/L4</text>
  <text x="315" y="267" class="small">默认只注入目录，细节按需取</text>

  <rect x="580" y="145" rx="16" ry="16" width="180" height="120" class="memory"/>
  <text x="670" y="180" text-anchor="middle" class="h">模型决策</text>
  <text x="670" y="210" text-anchor="middle" class="t">Interact / Reflect</text>
  <text x="670" y="235" text-anchor="middle" class="t">回答或选择工具</text>

  <rect x="815" y="125" rx="16" ry="16" width="245" height="160" class="action"/>
  <text x="937" y="158" text-anchor="middle" class="h">固定九类工具</text>
  <text x="840" y="190" class="t">文件 · 代码 · 网页</text>
  <text x="840" y="217" class="t">检查点 · 长期记忆</text>
  <text x="840" y="244" class="t">向用户提问</text>
  <text x="840" y="267" class="small">产生可观察的外部执行结果</text>

  <path d="M240 205 H290" class="line"/><path d="M525 205 H580" class="line"/><path d="M760 205 H815" class="line"/>

  <rect x="755" y="355" rx="16" ry="16" width="305" height="135" class="box"/>
  <text x="907" y="388" text-anchor="middle" class="h">验证反馈</text>
  <text x="780" y="420" class="t">成功：提炼事实 / SOP / 脚本</text>
  <text x="780" y="448" class="t">失败：重试 → 换策略 → 求助</text>
  <text x="780" y="474" class="small">只有执行并验证过的信息可沉淀</text>
  <path d="M937 285 V355" class="line"/>
  <path d="M755 420 C650 420 585 355 525 268" class="line"/>

  <rect x="290" y="355" rx="16" ry="16" width="365" height="150" class="control"/>
  <text x="472" y="388" text-anchor="middle" class="h">上下文预算控制</text>
  <text x="315" y="420" class="t">1 工具输出截断　2 旧轮次压缩</text>
  <text x="315" y="448" class="t">3 溢出时淘汰　4 锚点保留</text>
  <text x="315" y="478" class="small">目标：保留决策所需事实，而非单纯变短</text>
  <path d="M472 355 V285" class="line"/>

  <rect x="165" y="575" rx="16" ry="16" width="870" height="92" class="fail"/>
  <text x="600" y="608" text-anchor="middle" class="h" fill="#8f3333">失败路径：未经验证写入，或压缩丢掉来源与边界</text>
  <text x="600" y="638" text-anchor="middle" class="t">一次错误 → 长期记忆污染 → 后续检索复用 → 更快、更一致地做错</text>
  <path d="M820 490 C790 540 740 558 690 575" class="dash"/>
  <path d="M420 505 C430 545 470 560 520 575" class="dash"/>

  <g transform="translate(60,710)"><rect width="18" height="12" fill="#eef5ff" stroke="#5988bd"/><text x="27" y="11" class="small">状态/决策</text><rect x="130" width="18" height="12" fill="#eef9f2" stroke="#5d9972"/><text x="157" y="11" class="small">动作</text><rect x="225" width="18" height="12" fill="#fff7e8" stroke="#d29a3a"/><text x="252" y="11" class="small">预算控制</text><line x1="360" y1="6" x2="400" y2="6" stroke="#b84a4a" stroke-width="2" stroke-dasharray="7 5"/><text x="410" y="11" class="small">失败传播</text></g>
</svg>
