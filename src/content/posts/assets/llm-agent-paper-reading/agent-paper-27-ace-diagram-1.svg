<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ACE：条目式上下文的生成、反思、整理与演化</title>
  <desc id="desc">展示查询与当前 playbook 进入生成器，环境反馈进入反思器，整理器产生增量，由确定性逻辑合并去重，以及全量重写坍塌和错误反馈污染两条失败路径。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:15px;fill:#475569}.box-title{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#475569}.box{stroke-width:2;rx:14}.flow{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrow-blue)}.feedback{stroke:#475569;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow-gray)}.fail{stroke:#dc2626;stroke-width:2.5;stroke-dasharray:5 5;fill:none;marker-end:url(#arrow-red)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="55" y="52" class="title">ACE：条目式上下文的生成、反思、整理与演化</text>
  <text x="55" y="80" class="subtitle">核心约束：LLM 只提出局部 delta；程序按 ID 合并，避免整份上下文反复重写</text>

  <rect x="45" y="125" width="250" height="180" class="box" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="65" y="158" class="box-title">① 当前 Playbook Cₜ</text>
  <rect x="67" y="178" width="205" height="30" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="78" y="198" class="body">b7 · 工具步骤 · helpful 3</text>
  <rect x="67" y="217" width="205" height="30" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="78" y="237" class="body">b9 · 失败模式 · harmful 1</text>
  <rect x="67" y="256" width="205" height="30" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="78" y="276" class="body">…唯一 ID + 计数 + 内容</text>

  <rect x="355" y="125" width="225" height="180" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="375" y="158" class="box-title">② Generator</text>
  <text x="375" y="190" class="body">输入：查询 qₜ + Cₜ</text>
  <text x="375" y="217" class="body">输出：推理 / 工具轨迹 τₜ</text>
  <text x="375" y="244" class="body">标记：哪些条目有用或误导</text>
  <text x="375" y="277" class="small">同一模型负责实际任务执行</text>

  <rect x="665" y="125" width="225" height="180" class="box" fill="#ecfdf5" stroke="#15803d"/>
  <text x="685" y="158" class="box-title">③ 环境 / 评估</text>
  <text x="685" y="190" class="body">标签（可选）</text>
  <text x="685" y="217" class="body">执行成功 / 失败</text>
  <text x="685" y="244" class="body">API 状态与任务结果 fₜ</text>
  <text x="685" y="277" class="small">反馈质量决定可学到什么</text>

  <path d="M295 215 H355" class="flow"/>
  <path d="M580 215 H665" class="flow"/>

  <rect x="825" y="365" width="300" height="145" class="box" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="845" y="399" class="box-title">④ Reflector</text>
  <text x="845" y="430" class="body">比较轨迹、条目标记与反馈</text>
  <text x="845" y="457" class="body">提炼成功策略、错误原因、适用条件</text>
  <text x="845" y="484" class="small">可多轮精炼；过度反思也会引入噪声</text>
  <path d="M780 305 V335 Q780 350 800 350 H945 Q970 350 970 365" class="feedback"/>
  <path d="M525 305 V330 Q525 345 545 345 H825" class="feedback"/>

  <rect x="465" y="365" width="285" height="145" class="box" fill="#fff7ed" stroke="#c2410c"/>
  <text x="485" y="399" class="box-title">⑤ Curator：只写 Δₜ</text>
  <text x="485" y="430" class="body">新增条目 / 更新已有 ID</text>
  <text x="485" y="457" class="body">压缩本轮经验，不重写 Cₜ</text>
  <text x="485" y="484" class="small">局部改动可批量、并行产生</text>
  <path d="M825 438 H750" class="flow"/>

  <rect x="75" y="365" width="310" height="145" class="box" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="95" y="399" class="box-title">⑥ 确定性合并 + Grow-and-Refine</text>
  <text x="95" y="430" class="body">按 ID 追加 / 原位更新计数</text>
  <text x="95" y="457" class="body">嵌入去重；按需修剪低效条目</text>
  <text x="95" y="484" class="small">得到 Cₜ₊₁，进入下一查询或下一 epoch</text>
  <path d="M465 438 H385" class="flow"/>
  <path d="M170 365 V330 Q170 320 180 320 H210 V305" class="flow"/>

  <rect x="735" y="585" width="390" height="95" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="755" y="616" class="box-title" fill="#991b1b">失败路径 B：反馈污染</text>
  <text x="755" y="643" class="body">错误执行信号 → 错误反思 → 有害 delta 长期累积</text>
  <text x="755" y="664" class="small">持续对抗性更新时，论文观察到低于基础模型</text>
  <path d="M965 510 V585" class="fail"/>

  <rect x="335" y="585" width="340" height="95" class="box" fill="#fff1f2" stroke="#be123c"/>
  <text x="355" y="616" class="box-title" fill="#9f1239">对照失败 A：全量重写</text>
  <text x="355" y="643" class="body">Cₜ → LLM 重写整份 → 突然压缩、旧细节消失</text>
  <text x="355" y="664" class="small">ACE 用局部写权限切断此路径</text>
  <path d="M535 510 V585" class="fail"/>

  <g transform="translate(55,710)">
    <text x="0" y="0" class="box-title">图例</text>
    <line x1="75" y1="-5" x2="130" y2="-5" class="flow"/><text x="145" y="0" class="body">任务 / 上下文数据流</text>
    <line x1="350" y1="-5" x2="405" y2="-5" class="feedback"/><text x="420" y="0" class="body">反馈 / 归因流</text>
    <line x1="630" y1="-5" x2="685" y2="-5" class="fail"/><text x="700" y="0" class="body">失败或污染路径</text>
  </g>
</svg>
