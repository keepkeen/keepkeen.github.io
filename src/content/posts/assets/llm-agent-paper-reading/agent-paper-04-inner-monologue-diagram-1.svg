<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Inner Monologue 闭环机制</title>
  <desc id="desc">机器人执行语言模型选择的技能；环境结果被成功检测、场景描述或人类回答转成文本，追加到语言上下文，因而改变下一步的技能选择。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22577a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c95718"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", sans-serif; fill: #153243; }
      .label { font: 700 20px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", sans-serif; fill: #153243; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", sans-serif; fill: #263238; }
      .small { font: 14px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", sans-serif; fill: #455a64; }
      .forward { fill: none; stroke: #22577a; stroke-width: 3; marker-end: url(#arrow-blue); }
      .feedback { fill: none; stroke: #c95718; stroke-width: 5; stroke-dasharray: 12 7; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#fbfcfd"/>
  <text x="600" y="45" text-anchor="middle" class="title">环境反馈如何进入语言上下文，并修正下一步</text>

  <rect x="45" y="120" width="205" height="130" rx="14" fill="#edf5f9" stroke="#22577a" stroke-width="2"/>
  <text x="147" y="154" text-anchor="middle" class="label">任务与能力边界</text>
  <text x="68" y="190" class="body">高层指令 i</text>
  <text x="68" y="218" class="body">技能库 Π 及语言描述 ℓₖ</text>

  <rect x="315" y="105" width="275" height="160" rx="14" fill="#eef8f1" stroke="#2d6a4f" stroke-width="2"/>
  <text x="452" y="140" text-anchor="middle" class="label">LLM 规划器</text>
  <text x="338" y="176" class="body">当前语言上下文 Cₜ</text>
  <text x="338" y="204" class="body">读取已做动作与反馈</text>
  <text x="338" y="232" class="body">选择/生成下一个技能</text>

  <rect x="655" y="120" width="210" height="130" rx="14" fill="#edf5f9" stroke="#22577a" stroke-width="2"/>
  <text x="760" y="154" text-anchor="middle" class="label">执行器</text>
  <text x="678" y="190" class="body">选中技能 aₜ</text>
  <text x="678" y="218" class="body">低层策略 πₖ 与控制</text>

  <rect x="930" y="120" width="220" height="130" rx="14" fill="#fff7e8" stroke="#a66a00" stroke-width="2"/>
  <text x="1040" y="154" text-anchor="middle" class="label">环境</text>
  <text x="953" y="190" class="body">状态发生变化</text>
  <text x="953" y="218" class="body">成功、失败或新障碍</text>

  <path d="M250 185 H315" class="forward"/>
  <path d="M590 185 H655" class="forward"/>
  <path d="M865 185 H930" class="forward"/>
  <text x="278" y="172" class="small">提示</text>
  <text x="605" y="172" class="small">调用</text>
  <text x="877" y="172" class="small">作用</text>

  <rect x="805" y="365" width="345" height="205" rx="14" fill="#fff2ea" stroke="#c95718" stroke-width="2"/>
  <text x="977" y="402" text-anchor="middle" class="label">反馈适配器：世界 → 文本</text>
  <rect x="833" y="428" width="90" height="52" rx="8" fill="#ffffff" stroke="#c95718"/>
  <text x="878" y="449" text-anchor="middle" class="small">成功检测</text>
  <text x="878" y="468" text-anchor="middle" class="small">yes / no</text>
  <rect x="943" y="428" width="92" height="52" rx="8" fill="#ffffff" stroke="#c95718"/>
  <text x="989" y="449" text-anchor="middle" class="small">场景描述</text>
  <text x="989" y="468" text-anchor="middle" class="small">物体/进度</text>
  <rect x="1055" y="428" width="70" height="52" rx="8" fill="#ffffff" stroke="#c95718"/>
  <text x="1090" y="449" text-anchor="middle" class="small">人类</text>
  <text x="1090" y="468" text-anchor="middle" class="small">回答</text>
  <text x="832" y="520" class="body">输出 fₜ：可追加的自然语言</text>
  <text x="832" y="546" class="small">不是把图像直接喂给 LLM</text>

  <rect x="315" y="395" width="300" height="160" rx="14" fill="#fff2ea" stroke="#c95718" stroke-width="3"/>
  <text x="465" y="432" text-anchor="middle" class="label">上下文更新</text>
  <text x="340" y="470" class="body">Cₜ₊₁ = Cₜ ∥ 动作 ∥ fₜ</text>
  <text x="340" y="502" class="body">例：“抓取失败”</text>
  <text x="340" y="530" class="body">下一轮因此重试或改计划</text>

  <path d="M1040 250 V365" class="feedback"/>
  <path d="M805 468 H615" class="feedback"/>
  <path d="M465 395 V270" class="feedback"/>
  <text x="1054" y="318" class="small" fill="#9c3f0e">观测 oₜ₊₁</text>
  <text x="674" y="450" class="small" fill="#9c3f0e">转写反馈</text>
  <text x="483" y="335" class="small" fill="#9c3f0e">追加后再规划</text>

  <line x1="55" y1="635" x2="115" y2="635" stroke="#22577a" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="128" y="640" class="small">前向执行流</text>
  <line x1="300" y1="635" x2="370" y2="635" stroke="#c95718" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#arrow-orange)"/>
  <text x="383" y="640" class="small">闭环反馈流（本文的关键介入）</text>
  <text x="55" y="684" class="small">边界：反馈为空时退化为开环规划；反馈错误时，错误会直接污染后续上下文。</text>
</svg>
