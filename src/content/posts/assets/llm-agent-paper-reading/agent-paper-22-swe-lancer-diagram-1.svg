<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SWE-Lancer 从真实悬赏任务到经济价值评估的机制图</title>
  <desc id="desc">左侧是真实 Upwork issue 与代码库，中部并列展示独立开发者修复和经理提案选择，右侧展示测试或人类选择反馈以及按真实悬赏汇总的经济价值。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
    <style>
      .h{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#0f172a}.t{font:18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1e293b}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#475569}.box{stroke:#64748b;stroke-width:2;rx:16}.flow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.feedback{stroke:#b45309;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#dasharrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="50" y="48" class="h">真实自由职业问题如何变成可审计的 agent 能力与经济价值</text>
  <rect x="45" y="88" width="230" height="230" class="box" fill="#e0f2fe"/>
  <text x="70" y="124" class="h">真实输入</text>
  <text x="70" y="164" class="t">Upwork issue</text><text x="70" y="190" class="s">复现步骤 · 期望行为</text>
  <text x="70" y="228" class="t">历史代码库快照</text><text x="70" y="254" class="s">修复前状态 · 无未来提交</text>
  <text x="70" y="292" class="t">实际悬赏 pᵢ</text>
  <path d="M275 200 H350" class="flow"/>
  <rect x="350" y="78" width="405" height="270" class="box" fill="#ecfdf5"/>
  <text x="375" y="116" class="h">路径 A：IC SWE 交付</text>
  <text x="375" y="154" class="t">观察：issue + 仓库 + 终端</text>
  <text x="375" y="188" class="t">决策：定位 → 根因假设 → 修改</text>
  <text x="375" y="222" class="t">动作：代码 patch、命令、可选 user tool</text>
  <text x="375" y="256" class="t">反馈：日志/截图（隐藏最终 E2E 测试）</text>
  <rect x="375" y="278" width="350" height="48" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="394" y="309" class="t">全部适用 Playwright E2E 通过 ⇒ yᵢ=1</text>
  <rect x="350" y="390" width="405" height="214" class="box" fill="#f5f3ff"/>
  <text x="375" y="428" class="h">路径 B：SWE Manager 决策</text>
  <text x="375" y="468" class="t">观察：issue + 仓库 + 4–5 个真实提案</text>
  <text x="375" y="504" class="t">决策：可行性、边界条件、全库影响</text>
  <text x="375" y="540" class="t">动作：选择一个提案</text>
  <rect x="375" y="556" width="350" height="30" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="397" y="578" class="s">匹配原经理选择 ⇒ yᵢ=1（另有 99% 复核）</text>
  <path d="M275 245 C310 245 310 495 350 495" class="flow"/>
  <path d="M755 210 H815" class="flow"/>
  <path d="M755 495 H815" class="flow"/>
  <rect x="815" y="150" width="335" height="400" class="box" fill="#fff7ed"/>
  <text x="840" y="190" class="h">汇总与审计</text>
  <text x="840" y="235" class="t">任务成功率</text><text x="840" y="264" class="s">Acc = Σyᵢ / N</text>
  <text x="840" y="310" class="t">“赚得”金额</text><text x="840" y="339" class="s">E = Σpᵢyᵢ</text>
  <text x="840" y="385" class="t">赚取率</text><text x="840" y="414" class="s">ER = E / Σpᵢ</text>
  <text x="840" y="462" class="t">输出不是实际就业收入</text>
  <text x="840" y="490" class="s">它是：在冻结环境与规则下，</text><text x="840" y="514" class="s">模型成功任务对应的历史悬赏总和。</text>
  <path d="M980 550 C980 655 535 670 535 606" class="feedback"/>
  <text x="700" y="688" class="s" fill="#92400e">虚线：评估结果用于比较模型/脚手架，不在同一回合泄露给 agent</text>
  <rect x="45" y="365" width="230" height="185" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="405" class="h">关键失败点</text>
  <text x="70" y="445" class="t">“找对文件”≠“修对根因”</text>
  <text x="70" y="480" class="s">跨组件依赖、边界情形、</text>
  <text x="70" y="506" class="s">长延迟工具与完整验证链</text>
  <path d="M275 455 H350" class="feedback"/>
  <text x="50" y="695" class="s">实线＝任务数据/动作流；虚线＝失败诊断或离线评估反馈；颜色同时由标题和文字编码，不依赖颜色辨识。</text>
</svg>
